version: '3.8'

services:
  replica-mon:
    image: localhost/replica-mon:latest
    container_name: replica-mon
    # network_mode: host is required so the container can reach:
    #   - GlueSync Core Hub at localhost:1717
    #   - Prometheus at localhost:9090
    # Note: with host networking, 'ports:' is not used — the container
    #       binds directly to host ports (FastAPI → port 8081)
    network_mode: host
    entrypoint: ["uvicorn", "main:app", "--app-dir", "/app/replica-mon/backend", "--host", "0.0.0.0", "--port", "8081"]
    env_file:
      - .env
    environment:
      - QADMCLI_PATH=qadmcli
      - PROMETHEUS_URL=http://localhost:9090
      - QADMCLI_CONFIG=/app/qadmcli/config/connection.yaml
    volumes:
      # SQLite journal/CT cache (legacy monitor.py)
      - ./cache:/app/replica-mon/cache:Z
      # SQLite WebSocket metrics time-series store (new)
      - ./metrics:/app/replica-mon/metrics:Z
      # Scheduler and app logs
      - ./logs:/app/replica-mon/logs:Z
      # Saved static HTML reports
      - ./compare/reports:/app/replica-mon/compare/reports:Z
      # Static HTML files (live editing without rebuild)
      - ./monitor.html:/app/replica-mon/monitor.html:Z
      - ./verify_tool.html:/app/replica-mon/verify_tool.html:Z
      - ./ws_viewer.html:/app/replica-mon/ws_viewer.html:Z
      # Backend Python files (live editing without rebuild)
      - ./backend:/app/replica-mon/backend:Z
      # qadmcli config for AS400 connection (needed for verify tool)
      - ../qadmcli/config:/app/qadmcli/config:Z
    restart: unless-stopped
